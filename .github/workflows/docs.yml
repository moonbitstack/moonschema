name: Docs

# The site in `docs/` is published to Pages. The reference is regenerated from
# the package interface on every run, and the job fails when that changes the
# file — a reference that has drifted from the code is a bug, not a diff.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: the reference follows the code
        run: |
          moon update
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - name: build the library for the loom
        run: |
          moon build --target js --release examples/web
          mkdir -p docs/engine
          cp _build/js/release/build/moonbitstack/moonschema/examples/web/web.js docs/engine/moonschema.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
